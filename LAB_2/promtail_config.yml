server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400

scrape_configs:
  - job_name: nextcloud
    static_configs:
      - targets:
          - localhost
        labels:
          job: nextcloud_logs
          filename: /opt/nc_data/nextcloud.log
          __path__: /opt/nc_data/nextcloud.log